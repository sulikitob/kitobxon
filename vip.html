<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Umumumiy quiz test va yopiq savol-javoblar</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }
        body {
            font-family: 'Segoe UI', 'Arial', sans-serif;
            background: radial-gradient(ellipse at 50% 0%, #161616, #0a0a0a 60%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
            min-height: 100dvh;
        }

        /* ===== Oltin dizayn elementlari ===== */
        .gold-badge {
            width: 84px; height: 84px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #2e2e2e, #0f0f0f 70%);
            border: 3px solid #ffd700;
            box-shadow: 0 0 18px rgba(255,215,0,0.55), 0 0 40px rgba(255,215,0,0.2);
            display: flex; align-items: center; justify-content: center;
            font-size: 38px;
            margin-bottom: -8px;
            position: relative; z-index: 3;
        }

        /* ===== Raqam tanlash ekrani ===== */
        #select-screen {
            width: 100%; max-width: 700px;
            display: flex; flex-direction: column; align-items: center;
            gap: 25px;
            padding: 45px 30px 35px 30px;
            background: linear-gradient(160deg, rgba(16,16,16,0.55), rgba(10,10,10,0.55));
            backdrop-filter: blur(1px);
            border: 2px solid #ffd700;
            border-radius: 26px;
            box-shadow: 0 0 30px rgba(255,215,0,0.22), inset 0 0 40px rgba(255,215,0,0.03);
        }
        #select-screen h1 {
            font-size: 24px; color: #ffffff; text-align: center;
            letter-spacing: 1px;
            text-shadow: 0 0 12px rgba(255,255,255,0.3);
        }
        #select-screen p { color: #999; font-size: 14px; text-align: center; }
        .number-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(55px, 1fr));
            gap: 10px;
            width: 100%;
            max-height: 60vh;
            overflow-y: auto;
            padding: 10px;
            background: #111;
            border-radius: 20px;
            box-shadow: 0 0 25px rgba(255,215,0,0.1);
            border: 1px solid rgba(255,215,0,0.15);
        }
        .number-grid::-webkit-scrollbar { width: 8px; }
        .number-grid::-webkit-scrollbar-thumb { background: #ffd700; border-radius: 10px; }
        .num-btn {
            background: #1b1b1b;
            border: 2px solid #00ff99;
            color: #00ff99;
            border-radius: 12px;
            padding: 12px 0;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.25s;
            text-shadow: 0 0 8px rgba(0,255,153,0.6);
        }
        .num-btn:hover {
            background: #00ff99;
            color: #050505;
            box-shadow: 0 0 20px rgba(0,255,150,0.8);
            transform: scale(1.08);
        }
        .num-btn.picked {
            background: #ffd700;
            border-color: #ffd700;
            color: #050505;
            box-shadow: 0 0 20px rgba(255,215,0,0.8);
        }
        #range-info {
            color: #ffd700; font-size: 15px; font-weight: bold; min-height: 22px;
        }

        /* ===== Random tanlash bo'limi ===== */
        .random-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .random-main-btn {
            width: 100%;
            background: linear-gradient(135deg, #1b1b1b, #262626);
            border: 2px solid #ffd700;
            color: #ffd700;
            border-radius: 14px;
            padding: 14px 0;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.25s;
            text-shadow: 0 0 8px rgba(255,215,0,0.5);
            letter-spacing: 0.5px;
        }
        .random-main-btn:hover {
            background: #ffd700;
            color: #050505;
            box-shadow: 0 0 20px rgba(255,215,0,0.8);
            transform: scale(1.02);
        }
        .random-options-grid {
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 12px;
            width: 100%;
            padding: 15px;
            background: #111;
            border-radius: 18px;
            box-shadow: 0 0 25px rgba(255,215,0,0.12);
        }
        .random-num-btn {
            background: #1b1b1b;
            border: 2px solid #ffd700;
            color: #ffd700;
            border-radius: 12px;
            padding: 14px 0;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.25s;
        }
        .random-num-btn:hover {
            background: #ffd700;
            color: #050505;
            box-shadow: 0 0 20px rgba(255,215,0,0.8);
            transform: scale(1.08);
        }
        .clear-history-link {
            color: #666;
            font-size: 12px;
            text-decoration: underline;
            cursor: pointer;
            background: none;
            border: none;
        }
        .clear-history-link:hover { color: #ff9900; }

        /* ===== Funksiya tanlash ekrani ===== */
        #mode-screen {
            display: none;
            width: 100%; max-width: 700px;
            flex-direction: column; align-items: center;
            gap: 25px; padding: 20px 0;
        }

        .mode-icon-top {
            width: 100%;
            max-width: 450px;
            aspect-ratio: 4 / 3;
            position: relative;
            background: radial-gradient(circle at 35% 30%, #2e2e2e, #0f0f0f 70%);
            border: 3px solid #ffd700;
            border-radius: 20px;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 18px rgba(255,215,0,0.4), 0 0 40px rgba(255,215,0,0.15);
        }
        .mode-icon-top img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }

        #mode-screen h1 {
            font-size: 22px; color: #ffffff; text-align: center;
            margin: 5px 0;
            letter-spacing: 1px;
            text-shadow: 0 0 12px rgba(255,255,255,0.3);
        }

        .mode-wrapper {
            width: 100%;
            background: linear-gradient(160deg, rgba(16,16,16,0.55), rgba(10,10,10,0.55));
            backdrop-filter: blur(1px);
            border-radius: 26px;
            padding: 30px 25px;
            border: 2px solid #ffd700;
            box-shadow: 0 0 30px rgba(255,215,0,0.22), inset 0 0 40px rgba(255,215,0,0.03);
        }
        .mode-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        .mode-card {
            background: rgba(27, 27, 27, 0.85);
            border-radius: 20px;
            padding: 30px 15px;
            text-align: center;
            transition: 0.4s;
            color: white;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid rgba(255, 215, 0, 0.3);
            font-size: 16px;
            font-weight: bold;
            backdrop-filter: blur(3px);
        }
        .mode-card::before {
            content: ""; position: absolute; width: 200%; height: 200%;
            background: linear-gradient(45deg,transparent,#ffd700,transparent);
            top: -150%; left: -150%; transform: rotate(25deg); transition: 0.7s;
            opacity: 0.35;
        }
        .mode-card:hover::before { top: 100%; left: 100%; }
        .mode-card:hover { transform: translateY(-5px) scale(1.02); border-color: #ffd700; box-shadow: 0 0 15px rgba(255,215,0,0.3); }
        @media(max-width:600px){ .mode-grid{ grid-template-columns: 1fr; } }

        /* ===== Intro (countdown) ekran ===== */
        #intro-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            height: 100dvh;
            background: #050505; display: none; flex-direction: column;
            justify-content: center; align-items: center; z-index: 5;
            transition: opacity 0.8s ease;
        }
        #stars {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; overflow: hidden;
        }
        #select-screen, #mode-screen, .quiz-box, #intro-screen .content-box, #intro-screen #countdown {
            position: relative; z-index: 2;
        }
        .star {
            position: absolute;
            width: 2px; height: 2px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 2.5s infinite ease-in-out;
        }
        .star.glow {
            box-shadow: 0 0 6px 1px rgba(255, 215, 0, 0.5);
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.15; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.6); }
        }
        .content-box { text-align: center; margin-bottom: 50px; z-index: 1; position: relative; padding: 0 20px; }
        #countdown {
            position: absolute; bottom: 50px;
            font-size: 80px; color: #00ff99; font-weight: bold;
            animation: pulse 1s infinite;
            z-index: 1;
        }
        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.5; }
            50% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.5; }
        }

        .quran-box {
            display: block;
            margin: 25px auto 0 auto;
            padding: 20px 30px;
            max-width: 550px;
            border: 4px double #ffd700;
            background: rgba(20, 16, 5, 0.6);
            text-align: center;
        }
        .quran-ayat-text {
            font-size: 18px;
            line-height: 1.6;
            color: #f0f0f0;
            margin-bottom: 15px;
            display: block;
        }
        .quran-meta {
            display: inline-block;
            font-size: 15px;
            font-weight: bold;
            color: #ffd700;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-top: 1px solid rgba(255, 215, 0, 0.3);
            padding-top: 8px;
            width: 100%;
        }

        /* ===== Quiz ekrani ===== */
        .quiz-box {
            display: none;
            width: 100%; max-width: 600px; background: rgba(16,16,16,0.6); padding: 30px;
            border-radius: 25px; box-shadow: 0 0 30px rgba(255,215,0,0.18);
            border: 2px solid #ffd700;
            backdrop-filter: blur(1px);
            text-align: center; margin-top: 50px;
        }
        h2 { color: #00ff99; margin-bottom: 20px; font-size: 22px; }
        .option {
            display: block; width: 100%; padding: 15px; margin: 10px 0;
            background: #2a2a2a; border: 2px solid #333; border-radius: 15px;
            cursor: pointer; transition: 0.3s; text-align: left;
        }
        .option:hover { border-color: #00ff99; }
        .correct {
            background: #00ff99 !important; color: black; font-weight: bold;
            animation: bubbleEffect 0.5s ease-out;
        }
        @keyframes bubbleEffect {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        .wrong { background: #ff4d4d !important; color: white; }
        .btn-finish {
            width: 100%; padding: 15px; background: transparent; border: 2px solid #00ff99;
            color: #00ff99; border-radius: 15px; cursor: pointer; margin-top: 20px;
            font-weight: bold; transition: 0.3s;
        }
        .btn-finish:hover { background: #00ff99; color: black; }

        .closed-input {
            width: 100%; padding: 15px; margin-top: 10px; border: 2px solid #333;
            border-radius: 12px; font-size: 17px; outline: none; background: #2a2a2a;
            color: white;
        }
        .closed-input:focus { border-color: #00ff99; }
        .btn-check {
            width: 100%; padding: 15px; margin-top: 15px; border: 2px solid #00ff99; border-radius: 15px;
            background: transparent; color: #00ff99; font-weight: bold; cursor: pointer; font-size: 17px;
            transition: 0.3s;
        }
        .btn-check:hover { background: #00ff99; color: black; }
        #closed-result { margin-top: 15px; font-size: 18px; min-height: 30px; text-align: center; }


        /* ===== Mobil to'liq ekran tuzatishlari ===== */
        @media (max-width: 480px) {
            body { padding: 12px; }
            #select-screen { padding: 35px 16px 24px 16px; }
            #select-screen h1 { font-size: 20px; }
            .gold-badge { width: 68px; height: 68px; font-size: 30px; }
            #mode-screen h1 { font-size: 19px; }
            .mode-wrapper { padding: 20px 14px; }
            .mode-card { padding: 22px 10px; font-size: 14px; }
            .quiz-box { padding: 20px 16px; margin-top: 30px; }
            h2 { font-size: 18px; }
            .content-box h1 { font-size: 24px !important; }
            .quran-ayat-text { font-size: 15px; }
            #countdown { font-size: 60px; bottom: 35px; }
            .number-grid { grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); }
        }
    </style>
</head>
<body>

<div id="stars"></div>

<div id="select-screen">
    <div class="gold-badge">📖</div>
    <h1>🌙 Umumumiy quiz test va yopiq savol-javoblar</h1>
    <p>Savollar sonini belgilang</p>

    <div class="random-section">
        <button class="random-main-btn" id="randomToggleBtn" onclick="toggleRandomGrid()">🎲 Random</button>
        <div class="random-options-grid" id="randomOptionsGrid"></div>
        <button class="clear-history-link" onclick="clearUsedHistory()">🔄 Ishlatilgan tarixni tozalash</button>
    </div>

    <div id="range-info">Boshlang'ich raqamni tanlang</div>
    <div class="number-grid" id="numberGrid"></div>
</div>

<div id="mode-screen">
    <div class="mode-icon-top">
        <img src="sayr.jpg" alt="rasm">
    </div>
    <h1>Qaysi funksiyani xohlaysiz?</h1>
    <div class="mode-wrapper">
        <div class="mode-grid">
            <div class="mode-card" onclick="chooseMode('quiz')">Quiz testlar</div>
            <div class="mode-card" onclick="chooseMode('quiz-aralash')">Quiz aralash</div>
            <div class="mode-card" onclick="chooseMode('yopiq')">Yopiq savol-javob</div>
            <div class="mode-card" onclick="chooseMode('yopiq-aralash')">Yopiq savol-javob aralash</div>
        </div>
    </div>
</div>

<div id="intro-screen">
    <div class="content-box">
        <h1 style="color:#00ff99; font-size: 32px;">🌙 2-Bob.Iskandar-1</h1>
        <div id="random-ayat"></div>
    </div>
    <div id="countdown">3</div>
</div>

<div class="quiz-box" id="quiz">
    <h2 id="question">Yuklanmoqda...</h2>
    <div id="options"></div>
    <button class="btn-finish" onclick="finishQuiz()">Testni yakunlash</button>
</div>

<script>
const quizData = [
    { q: "Hamma tug'ilgan kunini qanday bahona bilan ziyorat qilishga kelar edi?", correct: "xotira kuni munosabati bilan", wrongs: ["sayohat qilish istagi bilan", "akshon tadbiri munosabati bilan", "shunchaki yo'qlab qo'yish maqsadida"] },
    { q: "Qishloqning nomi nima?", correct: "jiydalik", wrongs: ["tolzor", "terakli", "chinorli"] },
    { q: "Jiydalik qishlog'iga kelganlar nega kira olmay ovvora edilar?", correct: "tog'dan kelgan sel ko'prikni yarmini olib ketgani sababli", wrongs: ["yo'lda katta ko'chki sodir bo'lib yo'lni to'sib qo'ygani sababli", "daryo suvi toshib mashinalar o'ta olmay qolgani sababli", "qishloq ahli kirish yo'lini vaqtincha yopib qo'yganliklari sababli"] },
    { q: "Tundan kelgan ko'rshapalak deb nimaga ta'rif berilgan?", correct: "mashina", wrongs: ["samolyot", "poyezd", "mototsikl"] },
    { q: "Sel bir yili butun sigirni olib kelgan edi (ba'zilar to'ng'iz deb ham aytishadi).", correct: "to'g'ri", wrongs: ["noto'g'ri", "bunday voqea bo'lmagan", "isbotlanmagan gap"] },
    { q: "Sel kelishidan oldin hammayoqni qanday hid bosib ketadi?", correct: "kavrak, xaron", wrongs: ["shuvoq, yalpiz", "rayhon, isiriq", "chirindi, namlik"] },
    { q: "Ko'prikni sel bosganda undan o'tishning 1-yo'li qanday?", correct: "orqaga qaytib, kamida 60-70 chaqirim etakdagi masofani aylanib, tumanning narigi tarafidan kelish", wrongs: ["to'g'riga qarab yurib, daryoning sayozroq joyidan tavakkal qilib otda yoki piyoda o'tib olish", "suv pasayishini kutib, shu yerning o'zida bir necha kun chodir qurib lager qilib yashash", "ko'prikning qolgan qismiga vaqtincha yog'och taxtalar tashlab, emaklab bo'lsa ham o'tish"] },
    { q: "Ko'prikni sel bosganda undan o'tishning 2-yo'li qanday?", correct: "so'qmoq bo'ylab so'lga yurib, mahalla guzarlar oralab, tuman markaziga yaqin yangi ko'prik orqali o'tib borish", wrongs: ["tepalikka qarab o'ngga yurib, adirlar oshib, qishloqning yuqori tarafidagi eski osma ko'prikdan o'tish", "pastlikka qarab daryo yoqalab borib, baliqchilarning qayig'i yordamida narigi qirg'oqqa o'tib olish", "katta yo'ldan chetga chiqib, eski tashlandiq temir yo'l tarmog'i ustidagi ko'prikdan foydalanish"] },
    { q: "Bosh-oyoq jinsi libosdagi g'aybar, boyvachcha kishi kim?", correct: "iskandar", wrongs: ["g'ayrat", "oyravshan", "anvar"] },
    { q: "Iskandar Jiydalik qishlog'iga qanaqa moshinada keladi?", correct: "prado", wrongs: ["tahoe", "malibu", "captiva"] },
    { q: "Taksida 7-8 yashar bolasi bilan kelgan kishi kim?", correct: "oyravshan", wrongs: ["iskandar", "g'ayrat", "rustam"] },
    { q: "Maqolda aytilishicha: Zo'rniki...", correct: "tegirmon yurgizar", wrongs: ["oshini yer", "tog'ni talqon qilar", "yo'lni ochar"] },
    { q: "Iskandar qayerdan kelayotgan edi?", correct: "toshkentdan", wrongs: ["samarqanddan", "farg'onadan", "buxorodan"] },
    { q: "Yuki birgina osma sumkadan iborat ozg'inroq kishi kim?", correct: "g'ayrat aka", wrongs: ["iskandar aka", "oyravshan aka", "ahmad aka"] },
    { q: "G'ayrat aka qanaqa moshinada, necha kishi bilan kelgan edi?", correct: "kumush rang neksiyada 3 nafar kishi bilan", wrongs: ["oq rangli jentrada 2 nafar kishi bilan", "qora rangli kobaltda 4 nafar kishi bilan", "qizil rangli matizda 1 nafar kishi bilan"] },


 /* =====2-Bob ===== */


    { q: `Toshkentga kelganining nechanchi kuni peshinda unga Xoji bobo telefon qilgan edi?`, correct: `3-kuni`, wrongs: [`2-kuni`, `5-kuni`, `7-kuni`] },
    { q: `Bu kishi hech odamga o'xshab gapirolmaydi, bir og'izgina gapni ham albatta ohangjamaga solib, qo'yib bersangiz uch tilda birdek, Xayyomdan ruboiylar qo'shib aytsa, kim?`, correct: `Xoji bobo`, wrongs: [`Gena amaki`, `Abdushukur aka`, `G'ayrat aka`] },
    { q: `Iskandarning nega qaynota va qaynonasini ko'rishga ko'zi yo'q?`, correct: `O'zaro allaqanday yasama "adasi, oyisi" deb muomala qilishlari`, wrongs: [`Mol-dunyoga ortiqcha hirs qo'yishlari`, `Uni doim past ko'rib gapirishlari`, `Farzandlarini haddan tashqari erkalatishlari`] },
    { q: `Xoji bobo va xotini Toshkentda qancha vaqt yashab ketishgan edi?`, correct: `1 yildan ko'roq`, wrongs: [`6 oydan ko'proq`, `2 yildan ko'proq`, `3 oydan ko'proq`] },
    { q: `Xoji bobolar Toshkentning qayerida yashab ketishgan edi?`, correct: `Zarangning xuv bir gadoy topmas tog' qishlog'idan, lekin indamasangiz Londonu Parijdan lof urishadi`, wrongs: [`Tumanning eng chekka gadoy ko'p qishlog'idan, lekin so'zlasa Moskva-Peterburgdan gapiradi`, `Viloyatning eng qashshoq mahallasidan, lekin so'rasangiz Dubaydan kelgandek gapiradi`, `Tog'ning etagidagi kambag'al qishlog'idan, lekin gapirsa Nyu-Yorkdan lof uradi`] },
    { q: `Xoji bobo va xotini Toshkentga uzoq yillar nima bahona borishgan edi?`, correct: `Bebiliska bir sayyohlik yurishi sababdan`, wrongs: [`Bolalarini ko'rgani borish bahonasida`, `Davolanish uchun sayohat qilish niyatida`, `Nabiralarini yo'qlab kelish bahonasida`] },
    { q: `"Balchiqdan chiqqan beklar" iborasi kimlarga nisbatan aytilgan?`, correct: `Yangi boylarga / Xoji boboga`, wrongs: [`Eski amaldorlarga`, `Qishloq oqsoqollariga`, `Shahar amaldorlariga`] },
    { q: `Indamas, odamovi, qornini g'amlab, sigaretini tutatib tursa bas, kim?`, correct: `Jo'rabek`, wrongs: [`G'ayrat`, `Iskandar`, `Shokir`] },
    { q: `Iskandar muovinlikka o'tib, mashina minadigan bo'lganida Xoji bobo unga kimni tavsiya qilgan edi?`, correct: `Chala o'ris jiyanini`, wrongs: [`Uzoq qarindoshi bolasini`, `Qo'shni yigitchani`, `O'ris kelinning ukasini`] },
    { q: `Xoji bobo Xo'ja Xofizni ko'makka chorlab, 1 odamni 1000 ta kaliti bor deb nimani nazarda tutgan?`, correct: `Odamlarning qalbini / poraxo'rlikni`, wrongs: [`Odamlarning ishonchini`, `Amaldorlarning zaif tomonini`, `Xalqning e'tiqodini`] },
    { q: `Kimni ko'rib "bu kesakdan o't chiqqan" degan Jo'ra?`, correct: `Oyravshanni`, wrongs: [`Dilyani`, `Diloraning`, `Shurikni`] },

{ q: "Yer Quyoshning atrofida aylanadimi yoxud aksinchami –\nnima farqi bor deya befarq bo‘lish nahot qanday odamga yarashsa?! Omilik, betavfiqlik emasmi bunday fikrlash! Bunday nusxalar yeru quyosh harakatdan to‘xtagan taqdirda ham pinagini buzmas! Sizif uchun esa...xarsangtosh tepasidan qum zarralarining uchibto‘kilib tushganidayoq olamcha hikmat mavjud.", correct: "aqli raso", wrongs: ["xabardor", "gunohkor", "sabrli"] },

let activeQuiz = [];
let currentQ = 0, score = 0, answered = 0;
const RANDOM_PRESETS = [10, 15, 25, 33, 50, 100];
const USED_KEY = 'quizUsedIndices_2bob';

function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
}

function getUsedIndices() {
    try {
        return JSON.parse(localStorage.getItem(USED_KEY) || '[]');
    } catch (e) {
        return [];
    }
}

function saveUsedIndices(arr) {
    localStorage.setItem(USED_KEY, JSON.stringify(arr));
}

function buildStars() {
    const container = document.getElementById('stars');
    container.innerHTML = '';
    const count = 130;
    for (let i = 0; i < count; i++) {
        const s = document.createElement('div');
        const isGlow = Math.random() > 0.8;
        s.className = 'star' + (isGlow ? ' glow' : '');
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        const size = (isGlow ? (Math.random() * 1.5 + 2) : (Math.random() * 2 + 1)).toFixed(1);
        s.style.width = size + 'px';
        s.style.height = size + 'px';
        s.style.animationDelay = (Math.random() * 2.5).toFixed(2) + 's';
        s.style.animationDuration = (1.5 + Math.random() * 2).toFixed(2) + 's';
        container.appendChild(s);
    }
}

let rangeStart = null;
let numButtons = [];

window.onload = function() {
    const grid = document.getElementById('numberGrid');
    for (let i = 1; i <= quizData.length; i++) {
        const btn = document.createElement('button');
        btn.className = 'num-btn';
        btn.innerText = i;
        btn.onclick = () => pickNumber(i, btn);
        grid.appendChild(btn);
        numButtons.push(btn);
    }
    buildStars();

    // Random preset tugmalarini yaratish
    const randGrid = document.getElementById('randomOptionsGrid');
    RANDOM_PRESETS.forEach(n => {
        const btn = document.createElement('button');
        btn.className = 'random-num-btn';
        btn.innerText = n;
        btn.onclick = () => pickRandomCount(n);
        randGrid.appendChild(btn);
    });

    // Oldin ishlatilgan savollarni sariq rangda belgilab qo'yish
    markUsedButtons();

    const randomIdx = Math.floor(Math.random() * ayats.length);
    const selectedAyat = ayats[randomIdx];
    document.getElementById('random-ayat').innerHTML = `
        <div class="quran-box">
            <span class="quran-ayat-text">"${selectedAyat.text}"</span>
            <span class="quran-meta">${selectedAyat.meta}</span>
        </div>
    `;
};

function markUsedButtons() {
    const used = getUsedIndices();
    used.forEach(idx => {
        if (numButtons[idx]) numButtons[idx].classList.add('picked');
    });
}

function toggleRandomGrid() {
    const grid = document.getElementById('randomOptionsGrid');
    grid.style.display = (grid.style.display === 'grid') ? 'none' : 'grid';
}

function pickRandomCount(n) {
    let used = getUsedIndices();
    const allIndices = quizData.map((_, i) => i);
    let unused = allIndices.filter(i => !used.includes(i));

    // Agar ishlatilmagan savollar yetarli bo'lmasa, tarixni yangilaymiz (yangi aylanish boshlanadi)
    if (unused.length < n) {
        used = [];
        unused = allIndices;
    }

    const shuffledUnused = shuffle([...unused]);
    const selected = shuffledUnused.slice(0, n);

    // Tanlanganlarni "ishlatilgan" deb belgilaymiz va saqlaymiz
    used = [...used, ...selected];
    saveUsedIndices(used);

    // Savollarni asl tartibda joylaymiz
    const orderedSelected = [...selected].sort((a, b) => a - b);
    activeQuiz = orderedSelected.map(i => quizData[i]);

    // Tanlangan raqam tugmalarini sariq rangga bo'yash
    selected.forEach(i => {
        if (numButtons[i]) numButtons[i].classList.add('picked');
    });

    document.getElementById('range-info').innerText = `Tasodifiy tanlandi: ${n} ta savol`;

    setTimeout(() => {
        document.getElementById('select-screen').style.display = 'none';
        document.getElementById('mode-screen').style.display = 'flex';
    }, 500);
}

function clearUsedHistory() {
    localStorage.removeItem(USED_KEY);
    numButtons.forEach(btn => btn.classList.remove('picked'));
    document.getElementById('range-info').innerText = "Tarix tozalandi. Boshlang'ich raqamni tanlang";
}

function pickNumber(num, btnEl) {
    const info = document.getElementById('range-info');

    if (rangeStart === null) {
        rangeStart = num;
        btnEl.classList.add('picked');
        info.innerText = `Boshlang'ich: ${num}. Endi oxirgi raqamni tanlang`;
    } else {
        let start = rangeStart;
        let end = num;
        if (end < start) { const t = start; start = end; end = t; }
        btnEl.classList.add('picked');
        info.innerText = `Tanlandi: ${start} - ${end}`;
        setTimeout(() => startWithRange(start, end), 400);
    }
}

function startWithRange(start, end) {
    activeQuiz = quizData.slice(start - 1, end);
    document.getElementById('select-screen').style.display = 'none';
    document.getElementById('mode-screen').style.display = 'flex';
}

let quizMode = 'quiz';

function chooseMode(mode) {
    quizMode = mode;
    if (mode === 'quiz-aralash' || mode === 'yopiq-aralash') {
        activeQuiz = shuffle([...activeQuiz]);
    }
    document.getElementById('mode-screen').style.display = 'none';
    document.getElementById('intro-screen').style.display = 'flex';
    document.getElementById('intro-screen').style.opacity = '1';
    startTimer();
}

function startTimer() {
    let count = 3;
    let disp = document.getElementById("countdown");
    disp.innerText = count;
    let timer = setInterval(() => {
        count--;
        if (count > 0) {
            disp.innerText = count;
        } else if (count === 0) {
            disp.innerText = "Boshladik!";
        } else {
            clearInterval(timer);
            document.getElementById("intro-screen").style.opacity = "0";
            setTimeout(() => {
                document.getElementById("intro-screen").style.display = "none";
                document.getElementById("quiz").style.display = "block";
                loadQ();
            }, 800);
        }
    }, 1000);
}

function getOptionsFor(qData) {
    return shuffle([qData.correct, ...qData.wrongs]);
}

function loadQ() {
    const qData = activeQuiz[currentQ];
    document.getElementById('question').innerText = `${currentQ + 1}/${activeQuiz.length}. ${qData.q}`;
    const optDiv = document.getElementById('options');
    optDiv.innerHTML = '';

    if (quizMode === 'yopiq' || quizMode === 'yopiq-aralash') {
        loadClosedQ(qData, optDiv);
    } else {
        loadMultipleChoiceQ(qData, optDiv);
    }
}

function loadMultipleChoiceQ(qData, optDiv) {
    let shuffledOptions = getOptionsFor(qData);

    shuffledOptions.forEach((opt) => {
        const btn = document.createElement('div');
        btn.className = 'option';
        btn.innerText = opt;
        btn.onclick = () => check(opt, btn, qData.correct);
        optDiv.appendChild(btn);
    });
}

function loadClosedQ(qData, optDiv) {
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'closed-input';
    input.id = 'closed-answer';
    input.placeholder = 'Javob yozing...';
    input.onkeypress = (e) => { if (e.key === 'Enter') checkClosed(qData); };

    const checkBtn = document.createElement('button');
    checkBtn.className = 'btn-check';
    checkBtn.innerText = 'Tekshirish';
    checkBtn.onclick = () => checkClosed(qData);

    const resultDiv = document.createElement('div');
    resultDiv.id = 'closed-result';

    optDiv.appendChild(input);
    optDiv.appendChild(checkBtn);
    optDiv.appendChild(resultDiv);

    input.focus();
}

function checkClosed(qData) {
    const inputEl = document.getElementById('closed-answer');
    const resultDiv = document.getElementById('closed-result');
    const user = inputEl.value.toLowerCase().trim();
    const correct = qData.correct.toLowerCase().trim();

    answered++;
    inputEl.disabled = true;
    document.querySelector('.btn-check').disabled = true;

    if (user === correct) {
        resultDiv.innerHTML = '<b style="color:#00ff99;">✅ To\'g\'ri</b>';
        score++;
    } else {
        resultDiv.innerHTML = '<b style="color:#ff4444;">❌ Noto\'g\'ri.</b><br> Javob: ' + qData.correct;
    }

    setTimeout(() => {
        currentQ++;
        if (currentQ < activeQuiz.length) loadQ();
        else finishQuiz();
    }, 2000);
}

function check(selected, element, correct) {
    const options = element.parentElement.querySelectorAll('.option');
    options.forEach(opt => opt.style.pointerEvents = 'none');
    answered++;

    if (selected === correct) {
        element.classList.add('correct');
        score++;
    } else {
        element.classList.add('wrong');
        options.forEach(opt => {
            if (opt.innerText === correct) opt.classList.add('correct');
        });
    }
    setTimeout(() => {
        currentQ++;
        if (currentQ < activeQuiz.length) loadQ();
        else finishQuiz();
    }, 1000);
}

function finishQuiz() {
    let wrong = answered - score;
    document.getElementById('quiz').innerHTML = `
        <h2>Natijalar</h2>
        <div style="line-height: 2.2; font-size: 19px;">
            Jami savollar: <b>${activeQuiz.length} ta</b><br>
            To'g'ri javoblar: <span style="color:#00ff99;">${score} ta</span><br>
            Xato javoblar: <span style="color:#ff4d4d;">${wrong} ta</span>
        </div>
        <button class="btn-finish" onclick="location.reload()">Qaytadan boshlash</button>
    `;
}
</script>
